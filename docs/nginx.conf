# nginx in front of Image89, e.g. /etc/nginx/conf.d/image89.conf: files of
# conf.d are included in the http context. Replace the server name, the
# certificates and the upstream address. Image89 serves GET and HEAD only and
# has no authorization; it limits its own concurrent work (limits.*), so this
# file adds what it cannot do: TLS, buffering of slow clients, a shared cache
# of the images and limits per client address.

# Requests per second and concurrent requests of one client address. A page
# of the index asks for 6 thumbnails at once, so the burst and the
# connection limit leave room for it. Over the limits nginx answers 429.
limit_req_zone $binary_remote_addr zone=image89_req:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=image89_conn:10m;

# Images and pages are the same for one URL, version and config, and Image89
# sends them with Cache-Control: public, max-age=<server.cache_max_age>.
# nginx caches only what has that header: images and pages, not errors. For a
# cached page with an ETag, nginx itself answers If-None-Match with 304.
# inactive drops a response nobody asked for within an hour; max_size bounds
# the disk.
proxy_cache_path /var/cache/nginx/image89 levels=1:2 keys_zone=image89_cache:10m
                 max_size=2g inactive=1h use_temp_path=off;

# The access log keeps the request ID that nginx sends to Image89 (it logs
# the same request_id) and the cache status of the request.
log_format image89 '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   '$request_time rid=$request_id cache=$upstream_cache_status';

upstream image89 {
    server 127.0.0.1:8080;
    # Reused connections; below server.idle_timeout (60s) of Image89, so nginx
    # closes an idle connection before Image89 does.
    keepalive 16;
    keepalive_timeout 50s;
}

server {
    listen 80;
    listen [::]:80;
    server_name images.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name images.example.com;

    ssl_certificate     /etc/nginx/tls/image89.crt;
    ssl_certificate_key /etc/nginx/tls/image89.key;

    access_log /var/log/nginx/image89.access.log image89;

    # Requests have no body.
    client_max_body_size 1k;

    # The info pages; images are compressed already and stay as they are.
    gzip on;
    gzip_types text/plain;

    location / {
        limit_req zone=image89_req burst=20 nodelay;
        limit_req_status 429;
        limit_conn image89_conn 8;
        limit_conn_status 429;

        proxy_pass http://image89;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Image89 reuses it as its request ID, so the logs of both match.
        proxy_set_header X-Request-ID $request_id;
        # A cached response keeps the headers of the response that filled the
        # cache, with the request ID of that request: hide it and send the ID
        # of this request.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;

        # Keep buffering on (the default): nginx reads an image at once and
        # frees the generation slot, then sends it to a slow client by itself.
        # Without it a client reading slowly holds a slot of Image89 until
        # server.write_timeout. Large images go to temporary files.
        proxy_buffering on;
        proxy_max_temp_file_size 1024m;

        # Above limits.queue_timeout + limits.timeout of Image89 (2s + 15s by
        # default) and at most server.write_timeout (30s).
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        proxy_cache image89_cache;
        # Concurrent requests of one image wait for the first one instead of
        # generating it again, up to the time a generation may take.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 20s;
        proxy_cache_lock_age 20s;
        # An expired image is served while a fresh one is generated, and when
        # Image89 is busy (503) or down.
        proxy_cache_use_stale updating error timeout http_503;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
